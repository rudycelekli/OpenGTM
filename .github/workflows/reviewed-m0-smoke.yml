name: Reviewed private M0 correctness smoke
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reviewed-m0-smoke-${{ github.ref }}
  cancel-in-progress: false
jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: packet
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: rudycelekli/OpenGTM
          ref: 9188fc4d040c186f3495902fe77e0d041deba3bd
          path: source
          persist-credentials: false
      - name: Exact frozen source and fixture guards
        shell: bash
        run: |
          test "$(git -C packet rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(sha256sum packet/m0-fixture/review-packet.json | cut -d' ' -f1)" = "7816c4a286e7bc5c1cb5b491b929b5a45e824be2f9a61658cffbb85937ae3cde"
          test "$(git -C source rev-parse HEAD)" = 9188fc4d040c186f3495902fe77e0d041deba3bd
          python - <<'PYGUARD'
          import hashlib,json
          from pathlib import Path
          p=Path('packet/m0-fixture')
          r=json.loads((p/'review-packet.json').read_text())
          for name,digest in r['files'].items():
              assert hashlib.sha256((p/name).read_bytes()).hexdigest()==digest,name
          PYGUARD
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: false
      - name: Evaluator controls
        run: uv run --project source --frozen python -m pytest packet/m0-fixture/test_validator.py -q
      - name: Isolated native short smoke
        shell: bash
        env:
          M0_SOURCE_DIR: ${{ github.workspace }}/source
          M0_FIXTURE_DIR: ${{ github.workspace }}/packet/m0-fixture
          M0_OUTPUT_DIR: ${{ github.workspace }}/receipts
        run: bash packet/m0-fixture/isolated-smoke.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: m0-private-correctness-receipts
          path: receipts
